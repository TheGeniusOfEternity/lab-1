<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Лабораторная работа №1</title>
  </head>
  <body>
    <header>
      <h3>Сафин Максим Владиславович</h3>
      <h3>Группа P</h3>
      <h3>Вар №</h3>
    </header>
    <main>
      <section class="graph">
        <svg viewBox="0 0 300 300">
          <polygon points="30,150 150,150 150,30" fill="#b8c0ff" />
          <rect height="120" width="120" x="30" y="150" fill="#b8c0ff" />
          <path
            d="M 150 150
                         L 150 90
                         A 60 60 0 0 1 210 150
                         Z"
            fill="#b8c0ff"
          />

          <!-- Оси -->
          <line x1="0" y1="150" x2="300" y2="150" stroke="black" />
          <line x1="150" y1="0" x2="150" y2="300" stroke="black" />

          <!-- Стрелки-->
          <polygon class="arrow" points="150,0 144,15 150,10 156,15"></polygon>
          <polygon
            class="arrow"
            points="300,150 285,156 290,150 285,144"
          ></polygon>

          <!-- Насечки по Y -->
          <line x1="145" x2="155" y1="30" y2="30" stroke="black"></line>
          <line x1="145" x2="155" y1="90" y2="90" stroke="black"></line>
          <line x1="145" x2="155" y1="210" y2="210" stroke="black"></line>
          <line x1="145" x2="155" y1="270" y2="270" stroke="black"></line>

          <!-- Насечки по X -->
          <line y1="145" y2="155" x1="30" x2="30" stroke="black"></line>
          <line y1="145" y2="155" x1="90" x2="90" stroke="black"></line>
          <line y1="145" y2="155" x1="210" x2="210" stroke="black"></line>
          <line y1="145" y2="155" x1="270" x2="270" stroke="black"></line>

          <!-- Подписи осей -->
          <text x="290" y="140" font-size="16" fill="black">x</text>
          <text x="160" y="10" font-size="16" fill="black">y</text>

          <!-- Подписи R по Y -->
          <text x="160" y="35" font-size="16" fill="black">R</text>
          <text x="160" y="95" font-size="16" fill="black">R/2</text>
          <text x="160" y="215" font-size="16" fill="black">-R/2</text>
          <text x="160" y="275" font-size="16" fill="black">-R</text>

          <!-- Подписи R по X -->
          <text y="140" x="20" font-size="16" fill="black">-R</text>
          <text y="140" x="75" font-size="16" fill="black">-R/2</text>
          <text y="140" x="200" font-size="16" fill="black">R/2</text>
          <text y="140" x="265" font-size="16" fill="black">R</text>
        </svg>
      </section>
      <section class="form">
        <h2>Входные данные</h2>
        <form action="" method="post" id="inputForm">
          <label for="x_change"
            >Изменение Х:
            <select id="x_change">
              <option value="-2">-2</option>
              <option value="-1.5">-1.5</option>
              <option value="-1">-1</option>
              <option value="-0.5">-0.5</option>
              <option selected value="0">0</option>
              <option value="0.5">0.5</option>
              <option value="1">1</option>
              <option value="1.5">1.5</option>
              <option value="2">2</option>
            </select>
          </label>
          <label for="y_change"
            >Изменение Y:
            <input value="0" required type="text" id="y_change" />
          </label>
          <div class="r-change">
            <p>Изменение R:</p>
            <div class="inputs">
              <label for="r_change_1"
                >1
                <input
                  required
                  checked
                  name="r_change"
                  value="1"
                  type="radio"
                  id="r_change_1"
                />
              </label>
              <label for="r_change_2"
                >2
                <input name="r_change" value="2" type="radio" id="r_change_2" />
              </label>
              <label for="r_change_3"
                >3
                <input name="r_change" value="3" type="radio" id="r_change_3" />
              </label>
              <label for="r_change_4"
                >4
                <input name="r_change" value="4" type="radio" id="r_change_4" />
              </label>
              <label for="r_change_5"
                >5
                <input name="r_change" value="5" type="radio" id="r_change_5" />
              </label>
            </div>
          </div>
          <input type="submit" value="Определить" />
        </form>
        <h2>Результат</h2>
        <div class="result">
          <table id="table">
            <tr>
              <th>Коорд. X</th>
              <th>Коорд. Y</th>
              <th>Радиус R</th>
              <th>Факт попадания в область</th>
              <th>Текущее время</th>
              <th>Время выполнения скрипта (ms)</th>
            </tr>
          </table>
        </div>
      </section>
    </main>
    <script src="bundle.js"></script>
  </body>
</html>
